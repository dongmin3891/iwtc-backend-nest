name: Build and Push Backend Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "argocd/**"
      - "k8s/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: iwtc-backend-main
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dongmin3891/iwtc-backend-nest

jobs:
  verify-build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run lint
          npm test
          npm run test:e2e
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Update Kubernetes image tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          sed -i "s|image: ghcr.io/dongmin3891/iwtc-backend-nest:.*|image: ${IMAGE}|" k8s/backend-deployment.yaml
          sed -i "s|image: ghcr.io/dongmin3891/iwtc-backend-nest:.*|image: ${IMAGE}|" k8s/migration-job.yaml

      - name: Commit Kubernetes manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/backend-deployment.yaml k8s/migration-job.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes"
            exit 0
          fi

          git commit -m "ops: deploy ${GITHUB_SHA}"
          git push
